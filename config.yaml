model:
  default: me
  provider: openai-api
  aliases:
    gemini: openai-api/gemini/gemini-3.1-pro-preview
    deepseek: openai-api/cf/@cf/deepseek-ai/deepseek-r1-distill-qwen-32b
    kimi: openai-api/cf/@cf/moonshotai/kimi-k2.6
    qwen: openai-api/cf/@cf/qwen/qwen2.5-coder-32b-instruct
    llama: openai-api/cf/@cf/meta/llama-3.3-70b-instruct-fp8-fast
  auto_fallback: true
agent:
  agent_cache:
    memory_high_mb: '750'
terminal:
  backend: local
  cwd: /data/workspace
  timeout: 180
compression:
  enabled: true
  threshold: 0.85
delegation:
  model: memohermes
  provider: openai-api
command_allowlist:
  - script execution via heredoc
onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true
_config_version: 41
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: '792418415'
      name: M.A.M
      user_id: '792418415'
